<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar de Jogadores</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Campeonato da Turma</h1>

  <div class="placar">

    <div class="card">
      <h2 id="nome-ana">-</h2>
      <p class="pontos" id="pontos-ana">0</p>
      <button id="botao-ana">+1 ponto</button>
    </div>

    <div class="card">
      <h2 id="nome-beto">-</h2>
      <p class="pontos" id="pontos-beto">0</p>
      <button id="botao-beto">+1 ponto</button>
    </div>

    <div class="card">
      <h2 id="nome-bernardo">-</h2>
      <p class="pontos" id="pontos-bernardo">0</p>
      <button id="botao-bernardo">+1 ponto</button>
    </div>

  </div>

  <script src="games.js"></script>
</body>

</html>
